name: Check Images

on:
  push:
    branches: 
      - develop
      - main
  pull_request:
    branches: 
      - develop
      - main

concurrency:
  group: ${{ github.ref }}-check-images
  cancel-in-progress: true

jobs:
  check-broken-images:
    name: Broken Image Links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Check for broken image references
        run: python3 check_broken_images.py
      
      - name: Check for orphaned images (warning only)
        if: success() || failure()
        run: python3 check_broken_images.py --check-orphans || true
